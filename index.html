<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#102c4c">
  <title>Tijdelijk onderhoud – Koeltechniek Examen</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(145deg, #091a2c 0%, #153b5c 60%, #24668a 100%);
      color: #1b2b3b;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    main {
      width: min(100%, 570px);
      background: #fff;
      border-radius: 22px;
      padding: clamp(28px, 6vw, 52px);
      box-shadow: 0 20px 70px rgba(0, 0, 0, .27);
      text-align: center;
    }
    .symbol { font-size: 52px; line-height: 1.2; margin-bottom: 18px; }
    .status {
      display: inline-block;
      border-radius: 99px;
      padding: 6px 14px;
      background: #eaf2fa;
      color: #194b73;
      font-size: .84rem;
      font-weight: 700;
      letter-spacing: .02em;
    }
    h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); line-height: 1.2; margin: 20px 0 14px; }
    p { color: #556679; margin: 0 auto 24px; max-width: 440px; }
    .contact-title { font-weight: 700; color: #24394c; margin: 28px 0 14px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a.button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      border-radius: 10px;
      padding: 12px 22px;
      color: #fff;
      text-decoration: none;
      font-size: .97rem;
      font-weight: 650;
      transition: transform .12s ease, filter .12s ease;
    }
    a.button:hover { transform: translateY(-2px); filter: brightness(1.05); }
    a.button:focus-visible { outline: 3px solid #1f75c2; outline-offset: 3px; }
    .whatsapp { background: #14804c; }
    .email { background: #155c96; }
    footer { margin-top: 30px; color: #8290a0; font-size: .83rem; }
    @media (max-width: 400px) { .actions { flex-direction: column; } a.button { width: 100%; } }
    @media (prefers-reduced-motion: reduce) { a.button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <div class="symbol" aria-hidden="true">❄️🛠️</div>
    <span class="status">UPDATE BEZIG</span>
    <h1>We werken aan de examenquiz</h1>
    <p>De website <strong>Koeltechniek Examen</strong> is tijdelijk niet beschikbaar omdat we een update uitvoeren. Bedankt voor je begrip!</p>
    <div class="contact-title">Vragen? Neem gerust contact op:</div>
    <div class="actions">
      <a class="button whatsapp" href="https://wa.me/32465160225" target="_blank" rel="noopener noreferrer">💬 WhatsApp</a>
      <a class="button email" href="mailto:abderrahmaneelabbadi@hotmail.com">✉️ E-mail</a>
    </div>
    <footer>Koeltechniek Cat. I · Examenvragen</footer>
  </main>
</body>
</html>
